name: iOS

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Choisir Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lancer les tests communs sur le simulateur iPhone
        run: |
          chmod +x gradlew
          ./gradlew :shared:iosSimulatorArm64Test --no-daemon

      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Compiler l'appli iPhone (simulateur, sans signature)
        run: |
          cd iosApp
          xcodebuild -project Respire.xcodeproj -scheme Respire -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Préparer l'appli pour un simulateur en ligne
        run: |
          cd iosApp/build/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/Respire-simulateur.zip" Respire.app

      - uses: actions/upload-artifact@v4
        with:
          name: respire-simulateur-ios
          path: Respire-simulateur.zip
          if-no-files-found: error
