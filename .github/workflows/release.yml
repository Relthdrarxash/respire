name: Publication

# Une étiquette vX.Y.Z poussée sur GitHub :
#   1. lance les tests,
#   2. compile l'APK et l'AAB signés avec la clé d'envoi, numéro de version tiré de l'étiquette,
#   3. crée une version GitHub avec ces fichiers,
#   4. envoie l'AAB sur la piste de test interne de Google Play (si le compte de service est configuré).
# Le passage en production se fait à la main dans la Play Console, après vérification.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Versions signées, GitHub et Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_NAME: fr.respire.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Numéro de version depuis l'étiquette
        run: |
          bash scripts/version-from-tag.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_ENV"

      - name: Tests unitaires
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon

      - name: Restaurer la clé d'envoi
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_B64 manquant : impossible de signer une version publiable."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Compiler l'APK et l'AAB signés
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RESPIRE_VERSION_CODE: ${{ env.VERSION_CODE }}
          RESPIRE_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Respire-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "Respire-$VERSION_NAME.aab"
          sha256sum "Respire-$VERSION_NAME.apk" > "Respire-$VERSION_NAME.apk.sha256"

      - name: Créer la version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Respire-$VERSION_NAME.apk" "Respire-$VERSION_NAME.apk.sha256" "Respire-$VERSION_NAME.aab" \
            --title "Respire $VERSION_NAME" --generate-notes

      - name: Vérifier la configuration Google Play
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret PLAY_SERVICE_ACCOUNT_JSON absent : envoi à Google Play ignoré. L'AAB est dans la version GitHub."
          fi

      - name: Préparer les notes de version
        if: steps.play.outputs.enabled == 'true'
        run: bash scripts/play-whatsnew.sh "$VERSION_CODE"

      - name: Envoyer sur Google Play (test interne)
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: Respire-${{ env.VERSION_NAME }}.aab
          releaseName: ${{ env.VERSION_NAME }}
          track: internal
          # « draft » tant que l'appli n'a jamais été publiée sur une piste ; « completed » ensuite.
          # Réglable sans toucher au code : Settings > Secrets and variables > Actions > Variables.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: distribution/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
