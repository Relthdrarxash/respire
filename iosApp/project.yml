name: Respire
options:
  bundleIdPrefix: fr.respire
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "4.5.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Respire:
    type: application
    platform: iOS
    sources:
      - Respire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.respire.app
        PRODUCT_NAME: Respire
        INFOPLIST_FILE: Respire/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
    preBuildScripts:
      - name: Compiler le module shared
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
