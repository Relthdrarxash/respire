name: Captures d'écran

# Lancement manuel : compile l'appli, la lance sur un émulateur avec des données d'exemple,
# puis produit les captures pour la fiche Play Store et la vidéo de démonstration
# demandée par la déclaration d'accessibilité. Résultat : artefact « captures ».
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compiler l'APK de débogage
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur, captures et vidéo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: OUT=$GITHUB_WORKSPACE/captures bash scripts/screenshots/run.sh $GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: captures/
      - name: Publier dans la pré-version « captures »
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete captures --yes --cleanup-tag || true
          gh release create captures --prerelease --target "$GITHUB_SHA" \
            --title "Captures d'écran (données d'exemple)" \
            --notes "Captures pour la fiche Play Store et vidéo de démonstration, générées sur émulateur par screenshots.yml avec des données d'exemple." \
            captures/*
